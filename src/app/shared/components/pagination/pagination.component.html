@if (showPagination) {
  <nav class="pagination-footer" aria-label="Paginación">
    <div class="text-secondary small">
      @if (showResultsInfo && totalElements > 0) {
        {{ startItem }}–{{ endItem }} de {{ totalElements }} registros
      }
    </div>
    @if (showPageSizeSelector && pageSizeChange.observed) {
      <label class="d-flex align-items-center gap-2 small text-secondary"
        >Por página<select
          class="form-select form-select-sm"
          [ngModel]="pageSize"
          (ngModelChange)="onPageSizeChange(+$event)"
        >
          @for (size of pageSizeOptions; track size) {
            <option [ngValue]="size">{{ size }}</option>
          }
        </select></label
      >
    }
    <div class="d-flex align-items-center gap-1">
      <button
        class="btn btn-icon btn-sm btn-outline-secondary"
        [disabled]="!hasPreviousPage"
        (click)="goToFirstPage()"
        aria-label="Primera página"
      >
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons/tabler-sprite.svg#chevrons-left"></use>
        </svg></button
      ><button
        class="btn btn-icon btn-sm btn-outline-secondary"
        [disabled]="!hasPreviousPage"
        (click)="goToPreviousPage()"
        aria-label="Página anterior"
      >
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons/tabler-sprite.svg#chevron-left"></use>
        </svg></button
      ><span class="page-position"
        >Página {{ displayPageNumber }} de {{ totalPages || 1 }}</span
      ><button
        class="btn btn-icon btn-sm btn-outline-secondary"
        [disabled]="!hasNextPage"
        (click)="goToNextPage()"
        aria-label="Página siguiente"
      >
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons/tabler-sprite.svg#chevron-right"></use>
        </svg></button
      ><button
        class="btn btn-icon btn-sm btn-outline-secondary"
        [disabled]="!hasNextPage"
        (click)="goToLastPage()"
        aria-label="Última página"
      >
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons/tabler-sprite.svg#chevrons-right"></use>
        </svg>
      </button>
    </div>
  </nav>
}
